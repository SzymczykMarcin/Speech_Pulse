name: Deploy Privacy Policy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require public contact email
        env:
          PUBLIC_CONTACT_EMAIL: ${{ secrets.PUBLIC_CONTACT_EMAIL }}
        run: |
          if [ -z "$PUBLIC_CONTACT_EMAIL" ]; then
            echo "PUBLIC_CONTACT_EMAIL repository secret is required." >&2
            exit 1
          fi

      - name: Render docs
        env:
          PUBLIC_CONTACT_EMAIL: ${{ secrets.PUBLIC_CONTACT_EMAIL }}
        run: |
          mkdir -p build/pages
          cp -R docs/. build/pages/
          python - <<'PY'
          import os
          from pathlib import Path

          email = os.environ["PUBLIC_CONTACT_EMAIL"]
          docs_dir = Path("build/pages")

          for path in docs_dir.rglob("*.md"):
              text = path.read_text(encoding="utf-8")
              path.write_text(
                  text.replace("{{PUBLIC_CONTACT_EMAIL}}", email),
                  encoding="utf-8",
              )
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - id: deployment
        uses: actions/deploy-pages@v4
