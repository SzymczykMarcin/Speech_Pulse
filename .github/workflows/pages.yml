name: Deploy Privacy Policy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare docs
        run: |
          mkdir -p build/pages/privacy-policy
          python - <<'PY'
          from html import escape
          from pathlib import Path

          source = Path("docs/privacy_policy.md")
          text = source.read_text(encoding="utf-8")
          if text.startswith("---"):
              text = text.split("---", 2)[2].lstrip()

          title = "Speech Pulse Privacy Policy"
          body = []
          in_list = False
          for raw_line in text.splitlines():
              line = raw_line.rstrip()
              if not line:
                  if in_list:
                      body.append("</ul>")
                      in_list = False
                  continue
              if line.startswith("# "):
                  if in_list:
                      body.append("</ul>")
                      in_list = False
                  body.append(f"<h1>{escape(line[2:])}</h1>")
              elif line.startswith("## "):
                  if in_list:
                      body.append("</ul>")
                      in_list = False
                  body.append(f"<h2>{escape(line[3:])}</h2>")
              elif line.startswith("- "):
                  if not in_list:
                      body.append("<ul>")
                      in_list = True
                  body.append(f"<li>{escape(line[2:])}</li>")
              else:
                  body.append(f"<p>{escape(line).replace('`', '')}</p>")
          if in_list:
              body.append("</ul>")

          html = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{title}</title>
            <style>
              body {{
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                line-height: 1.6;
                margin: 0;
                color: #1f2933;
                background: #fafafa;
              }}
              main {{
                max-width: 760px;
                margin: 0 auto;
                padding: 32px 20px 56px;
                background: #fff;
              }}
              h1, h2 {{
                line-height: 1.25;
              }}
            </style>
          </head>
          <body>
            <main>
              {"".join(body)}
            </main>
          </body>
          </html>
          """
          Path("build/pages/privacy-policy/index.html").write_text(html, encoding="utf-8")
          Path("build/pages/index.html").write_text(
              '<!doctype html><html lang="en"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              '<meta http-equiv="refresh" content="0; url=privacy-policy/">'
              '<title>Speech Pulse</title></head><body>'
              '<p><a href="privacy-policy/">Speech Pulse Privacy Policy</a></p>'
              '</body></html>',
              encoding="utf-8",
          )
          PY
          cp docs/privacy_policy.md build/pages/privacy-policy/privacy_policy.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - id: deployment
        uses: actions/deploy-pages@v4
